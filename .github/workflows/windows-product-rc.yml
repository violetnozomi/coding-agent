name: Windows Product RC

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-product:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Install product and release tools
        run: python -m pip install -e ".[dev]" build "setuptools>=68" wheel
      - name: Verify default Windows ConPTY dependency
        run: python -c "import winpty; print(winpty.__file__)"
      - name: Install native Windows LSP acceptance servers
        shell: pwsh
        run: |
          python -m pip install basedpyright
          npm install --global typescript typescript-language-server
          go install golang.org/x/tools/gopls@latest
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify native parser wheels
        run: python -c "import tree_sitter, tree_sitter_javascript, tree_sitter_typescript, tree_sitter_go"
      - name: Platform and doctor evidence
        shell: pwsh
        env:
          API_KEY: nz-coder-ci-doctor-placeholder
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          nz-coder platform --json | Out-File artifacts/platform.json -Encoding utf8
          nz-coder doctor --json | Out-File artifacts/doctor.json -Encoding utf8
      - name: Cancellation contract wait diagnostics
        timeout-minutes: 3
        # Only synthetic file data: expose blocked thread locations without
        # publishing the full suite's potentially sensitive captured output.
        run: >-
          python -m pytest tests/runtime/tool_runtime/standalone/test_component_contract.py
          -k real_cancel -q --tb=short -o faulthandler_timeout=10 --durations=2
      - name: Native Windows product acceptance
        shell: pwsh
        run: |
          python -m tests.stability_capture --output artifacts/safe/suite -- `
            tests/test_windows_platform_runtime.py `
            tests/test_windows_shell_runtime.py `
            tests/test_windows_native_smoke.py `
            tests/test_windows_crash_cleanup.py `
            tests/test_private_paths.py `
            tests/test_process_backends.py `
            tests/test_process_service.py `
            tests/test_http_service.py `
            tests/test_daemon.py `
            tests/test_daemon_diagnostics.py `
            tests/test_stability_diagnostics.py `
            tests/test_stability_capture.py `
            tests/test_repo_languages.py `
            tests/test_repo_map_diagnostics.py `
            tests/test_workflow_runtime.py `
            tests/test_workflow_deterministic.py `
            tests/test_terminal_backend.py `
            tests/test_tui_product_frames.py `
            tests/test_fullscreen.py `
            tests/security/test_project_control_snapshot.py `
            tests/security/test_transaction_recovery.py `
            tests/security/test_transaction_track.py `
            tests/security/test_pr2_remaining_regressions.py `
            tests/recovery `
            tests/runtime/tool_runtime `
            tests/test_architecture_boundary.py `
            tests/test_repo_intelligence_consistency.py `
            tests/test_lsp.py `
            tests/test_lsp_workspace_config.py `
            tests/test_mcp.py
          exit $LASTEXITCODE
      - name: Verify controlled failure evidence capture
        if: always()
        run: python -m tests.stability_capture --self-test --output artifacts/safe/controlled-failure
      - name: Wheel sdist and fresh-install smoke
        shell: pwsh
        run: |
          python -m build --wheel --sdist
          $wheel = Get-ChildItem dist/nz_coder-*.whl -File
          if ($wheel.Count -ne 1) { throw "Expected exactly one wheel." }
          python -m venv "$env:RUNNER_TEMP/nz-coder-release"
          $python = "$env:RUNNER_TEMP/nz-coder-release/Scripts/python.exe"
          & $python -m pip install $wheel.FullName
          Push-Location $env:RUNNER_TEMP
          & $python -m nz_coder --help
          if ($LASTEXITCODE -ne 0) { throw "Installed CLI help failed." }
          & $python -m nz_coder platform --json | Out-File "$env:GITHUB_WORKSPACE/artifacts/installed-platform.json" -Encoding utf8
          Pop-Location
      - name: Upload Windows RC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-rc-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/safe/

  linux-product-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]" build "setuptools>=68" wheel
      - run: mkdir -p artifacts
      - name: Linux product acceptance
        run: >-
          python -m tests.stability_capture --output artifacts/safe/suite --
          tests/test_terminal_product_final.py
          tests/test_terminal_backend.py
          tests/test_tui_product_frames.py
          tests/test_fullscreen.py
          tests/test_http_service.py
          tests/test_daemon.py
      - run: python -m nz_coder --help
      - run: python -m build --wheel --sdist
      - name: Upload Linux product evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-product-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/safe/
