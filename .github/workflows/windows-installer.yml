name: Windows Installer

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install product and frozen-build tools
        run: python -m pip install ".[dev]" pyinstaller==6.16.0
      - name: Run cross-platform installer contracts
        run: python -m pytest -q tests/test_windows_installer_release.py
      - name: Parse PowerShell release scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @("scripts/build_windows_installer.ps1", "scripts/test_windows_installer.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              $failed = $true
            }
          }
          if ($failed) { throw "PowerShell parser validation failed." }
      - name: Locate Inno Setup compiler
        id: inno
        shell: pwsh
        run: |
          $path = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $path)) { throw "Inno Setup 6 is unavailable." }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build self-contained setup executable
        shell: pwsh
        run: >-
          ./scripts/build_windows_installer.ps1
          -Python python
          -Iscc "${{ steps.inno.outputs.path }}"
          -OutputDirectory "$PWD/dist/installer"
          -EvidencePath "$PWD/artifacts/windows-installer-build.json"
      - name: Test install upgrade product and uninstall lifecycle
        shell: pwsh
        run: |
          $artifact = Get-ChildItem dist/installer/NZ-Coder-*-windows-x64-setup.exe -File
          if ($artifact.Count -ne 1) { throw "Expected exactly one setup executable." }
          ./scripts/test_windows_installer.ps1 `
            -Artifact $artifact.FullName `
            -EvidencePath "$PWD/artifacts/windows-installer-smoke.json" `
            -TemporaryRoot "$env:RUNNER_TEMP/NZ Coder Setup Lifecycle"
      - name: Create checksum and validate release tag
        shell: pwsh
        run: |
          $artifact = Get-ChildItem dist/installer/NZ-Coder-*-windows-x64-setup.exe -File
          $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($artifact.Name)" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $identity = python scripts/windows_installer_contract.py --root . --json | ConvertFrom-Json
            if ($env:GITHUB_REF_NAME.Substring(1) -ne $identity.version) {
              throw "Tag version does not match pyproject.toml."
            }
          }
      - name: Upload tested Windows installer and evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-evidence
          if-no-files-found: error
          path: |
            dist/installer/NZ-Coder-*-windows-x64-setup.exe
            artifacts/windows-installer-build.json
            artifacts/windows-installer-smoke.json
            artifacts/SHA256SUMS.txt
      - name: Publish tested version-tag artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/installer/NZ-Coder-*-windows-x64-setup.exe
            artifacts/windows-installer-build.json
            artifacts/windows-installer-smoke.json
            artifacts/SHA256SUMS.txt
