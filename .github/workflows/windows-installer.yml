name: Windows Installer

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install product and frozen-build tools
        run: python -m pip install ".[dev]" pyinstaller==6.16.0
      - name: Run tracked installer contracts
        run: python -m pytest -q tests/test_windows_installer_release.py
      - name: Build and validate frozen product
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force artifacts, dist/installer | Out-Null
          python -m PyInstaller --noconfirm --clean `
            --workpath build/windows-installer `
            --distpath dist `
            packaging/windows/nz-coder.spec
          python -m nz_coder.evaluation.release_contracts `
            --root . `
            --validate-frozen dist/NZ-Coder `
            --json | Out-File artifacts/windows-frozen-contract.json -Encoding utf8
      - name: Locate Inno Setup compiler
        id: inno
        shell: pwsh
        run: |
          $path = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $path)) { throw "Inno Setup 6 is unavailable." }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Compile setup executable
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $identity = python -m nz_coder.evaluation.release_contracts --root . --json | ConvertFrom-Json
          $iscc = "${{ steps.inno.outputs.path }}"
          & $iscc `
            "/DAppVersion=$($identity.version)" `
            "/DSourceDir=$PWD\dist\NZ-Coder" `
            "/DOutputDir=$PWD\dist\installer" `
            "packaging\windows\nz-coder.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe failed with exit code $LASTEXITCODE." }
      - name: Test silent install upgrade product and safe uninstall
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $artifact = @(Get-ChildItem dist/installer/NZ-Coder-*-windows-x64-setup.exe -File)
          if ($artifact.Count -ne 1) { throw "Expected exactly one setup executable." }
          $installRoot = Join-Path $env:RUNNER_TEMP "NZ Coder Install Path With Spaces"
          $workspace = Join-Path $env:RUNNER_TEMP "NZ Coder Workspace"
          New-Item -ItemType Directory -Force $workspace | Out-Null
          Set-Content (Join-Path $workspace "workspace.env.sentinel") "preserve"
          New-Item -ItemType Directory -Force (Join-Path $workspace ".nz-coder") | Out-Null
          Set-Content (Join-Path $workspace ".nz-coder\workspace.state.sentinel") "preserve"
          $arguments = @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER",
            "/DIR=`"$installRoot`""
          )
          foreach ($attempt in 1..2) {
            $install = Start-Process -FilePath $artifact[0].FullName -ArgumentList $arguments -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Silent install attempt $attempt failed." }
          }
          $exe = Join-Path $installRoot "nz-coder.exe"
          & $exe --help | Out-File artifacts/installed-help.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Installed CLI help failed." }
          & $exe platform --json | Out-File artifacts/installed-platform.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Installed platform probe failed." }
          & $exe config show --json | Out-File artifacts/installed-config.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Installed config probe failed." }
          $uninstaller = Join-Path $installRoot "unins000.exe"
          $uninstall = Start-Process -FilePath $uninstaller `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER") `
            -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed." }
          if (Test-Path -LiteralPath $exe) { throw "Uninstall left the product executable behind." }
          foreach ($sentinel in @(
            (Join-Path $workspace "workspace.env.sentinel"),
            (Join-Path $workspace ".nz-coder\workspace.state.sentinel")
          )) {
            if (-not (Test-Path -LiteralPath $sentinel)) {
              throw "Uninstall removed workspace-owned state: $sentinel"
            }
          }
          @{
            artifact = $artifact[0].Name
            install_attempts = 2
            product_commands = @("--help", "platform --json", "config show --json")
            uninstall_exit_code = $uninstall.ExitCode
            workspace_preserved = $true
          } | ConvertTo-Json | Out-File artifacts/windows-installer-smoke.json -Encoding utf8
      - name: Create checksum and validate release tag
        shell: pwsh
        run: |
          $artifact = @(Get-ChildItem dist/installer/NZ-Coder-*-windows-x64-setup.exe -File)
          if ($artifact.Count -ne 1) { throw "Expected exactly one setup executable." }
          $hash = (Get-FileHash -LiteralPath $artifact[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($artifact[0].Name)" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $identity = python -m nz_coder.evaluation.release_contracts --root . --json | ConvertFrom-Json
            if ($env:GITHUB_REF_NAME.Substring(1) -ne $identity.version) {
              throw "Tag version does not match pyproject.toml."
            }
          }
      - name: Upload tested Windows installer and evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-evidence
          if-no-files-found: error
          path: |
            dist/installer/NZ-Coder-*-windows-x64-setup.exe
            artifacts/windows-frozen-contract.json
            artifacts/windows-installer-smoke.json
            artifacts/installed-help.txt
            artifacts/installed-platform.json
            artifacts/installed-config.json
            artifacts/SHA256SUMS.txt

  release:
    needs: windows-installer
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the tested Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-evidence
          path: release-evidence
      - name: Publish only the tested version-tag artifact
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release-evidence/**/*-windows-x64-setup.exe
            release-evidence/**/windows-frozen-contract.json
            release-evidence/**/windows-installer-smoke.json
            release-evidence/**/SHA256SUMS.txt
