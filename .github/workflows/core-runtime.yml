name: Core Runtime

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install product and development tools
        run: python -m pip install -e '.[dev]' build
      - name: Compile runtime
        run: python -m compileall -q nz_coder
      - name: Check focused ToolRuntime contracts
        run: |
          python -m pip install basedpyright==1.39.9
          python tests/typecheck/check_tool_contracts.py
      - name: Run complete Python test suite
        run: python -m tests.stability_capture --output artifacts/safe/suite --
      - name: Verify controlled failure evidence capture
        if: always()
        run: python -m tests.stability_capture --self-test --output artifacts/safe/controlled-failure
      - name: Upload safe runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/safe/
      - name: Smoke CLI entrypoint
        run: python -m nz_coder --help
      - name: Lint tracked runtime and tests
        run: ruff check .
      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist

  python-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install supported-floor runtime
        run: python -m pip install -e '.[dev]' build
      - name: Compile on the declared Python floor
        run: python -m compileall -q nz_coder
      - name: Run critical runtime compatibility contracts
        run: >-
          python -m tests.stability_capture --output artifacts/safe/suite --
          tests/runtime/test_native_runner.py
          tests/runtime/tool_runtime
          tests/test_loop_fake.py
          tests/test_public_error_boundary_phase3.py
          tests/test_daemon_diagnostics.py
          tests/test_stability_diagnostics.py
          tests/test_stability_capture.py
          tests/test_repo_map_diagnostics.py
          tests/test_workflow_runtime.py
          tests/test_workflow_deterministic.py
      - name: Upload safe compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python310-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/safe/
      - name: Smoke CLI on the declared Python floor
        run: python -m nz_coder --help
      - name: Build distributions on the declared Python floor
        run: python -m build --wheel --sdist

  installed-wheel-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build --wheel --sdist
      - name: Install and probe the wheel outside the source tree
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/nz-coder-installed"
          "$RUNNER_TEMP/nz-coder-installed/bin/python" -m pip install dist/nz_coder-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/nz-coder-installed/bin/nz-coder" --help
          "$RUNNER_TEMP/nz-coder-installed/bin/nz-coder" doctor --repo-intelligence-only --json
          "$RUNNER_TEMP/nz-coder-installed/bin/nz-coder" config show --json
          "$RUNNER_TEMP/nz-coder-installed/bin/python" -c \
            'from importlib.metadata import version; from importlib.resources import files; assert version("nz-coder"); assert files("nz_coder").joinpath("bundled_skills").is_dir(); assert files("nz_coder").joinpath("bundled_commands").is_dir()'
