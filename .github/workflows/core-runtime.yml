name: Core Runtime

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install product and development tools
        run: python -m pip install -e '.[dev]' build
      - name: Compile runtime
        run: python -m compileall -q nz_coder
      - name: Run complete Python test suite
        run: python -m pytest -q
      - name: Smoke CLI entrypoint
        run: python -m nz_coder --help
      - name: Lint tracked runtime and tests
        run: ruff check .
      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist
